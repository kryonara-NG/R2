<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Reelhouse</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body><div class="tabs" id="tb2" style="padding-bottom:6px;overflow-x:auto"></div><div style="padding:0 18px 8px"><input class="in" id="q" placeholder="Search people"></div><div class="pplist" id="L"></div><script src="shared.js"></script><script>
RH.guard();let l=new URLSearchParams(location.search).get('l')||'fo';RH.hdr('People');
const DD={d1:400,d2:200,d3:70,d4:35,d5:5,d6:130},L=$('#L');
function sets(){const f=RH.friends(),fo=RH.followers(),ar=Object.values(RH.get('rh_follow',{}));return{f,fo,fw:Object.values(f),ar,all:RH.people()}}
function draw(){const S=sets(),q=$('#q').value.toLowerCase();
 const T=[['fo','Followers',S.fo.length],['fw','Following',S.fw.length],['ar','Artists',S.ar.length],['find','Find',S.all.length]];
 $('#tb2').innerHTML=T.map(t=>`<button data-l="${t[0]}" class="${t[0]==l?'on':''}" style="font-size:12.5px;white-space:nowrap">${t[1]} ${t[2]}</button>`).join('');
 if(l=='ar'){const a=S.ar.filter(x=>x.name.toLowerCase().includes(q));L.innerHTML=a.length?a.map(x=>`<a class="fr" href="person.html?id=${x.id}"><i>⭐</i><span>${esc(x.name)}<small>Artist</small></span><em>›</em></a>`).join(''):'<div class="state"><b>No artists yet</b>Follow actors from their profile pages.<br><br><a class="btn p" href="search.html">Find actors</a></div>';return}
 let list=l=='fo'?S.fo:l=='fw'?S.fw:S.all.slice().sort((a,b)=>(RH.match(b)||0)-(RH.match(a)||0));
 list=list.filter(p=>p.name.toLowerCase().includes(q));
 L.innerHTML=list.length?list.map(p=>{const on=!!S.f[p.id],fb=!!p.fb,m=RH.match(p),d=DD[p.id]??(p.email?RH.days():3),
  tag=fb&&on?'Friends':fb?'Follows you':on?'Following':'';
  return`<div class="fr" style="cursor:default"><i>${p.av||'👤'}${RH.tag(d)}</i><span>${esc(p.name)}<small>${[tag,m?m+'% taste match':''].filter(Boolean).join(' - ')||'Reelhouse member'}</small></span><button class="btn${on?'':' p'}" data-p="${p.id}" style="height:34px;padding:0 14px;font-size:13px">${on?'Following':fb?'Follow back':'Follow'}</button></div>`}).join(''):'<div class="state"><b>Nobody here</b>'+(l=='fw'?'You are not following anyone yet.<br><br><button class="btn p" data-l="find">Find people</button>':l=='fo'?'Followers will appear here.':'Try another name.')+'</div>'}
$('#tb2').onclick=e=>{const b=e.target.closest('button');if(b){l=b.dataset.l;history.replaceState(0,'','?l='+l);draw()}};
L.onclick=e=>{const g=e.target.closest('[data-l]');if(g){l=g.dataset.l;draw();return}const b=e.target.closest('[data-p]');if(!b)return;const p=RH.people().find(x=>x.id==b.dataset.p),on=RH.follow(p);if(on)RH.toast('Following '+p.name);draw()};
$('#q').oninput=draw;draw();
</script></body></html>
