<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Reelhouse</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body><div id="c"><div class="sk" style="height:300px;margin:18px;border-radius:20px"></div></div><script src="shared.js"></script><script>

RH.guard();RH.hdr('Profile');const id=new URLSearchParams(location.search).get('id'),c=$('#c');
(async()=>{try{const p=await RH.api('/person/'+id,'&append_to_response=combined_credits');document.title=p.name;
 const age=p.birthday?Math.floor(((p.deathday?new Date(p.deathday):new Date())-new Date(p.birthday))/315576e5):null,fl=RH.get('rh_follow',{}),mv=(p.combined_credits.cast||[]).filter(m=>m.media_type=='movie'&&m.title);
 const known=[...mv].sort((a,b)=>b.popularity-a.popularity).filter((m,i,a)=>a.findIndex(x=>x.id==m.id)==i).slice(0,14),films=[...mv].filter(m=>m.release_date).sort((a,b)=>b.release_date.localeCompare(a.release_date)).slice(0,25);
 const bio=p.biography||'No biography available yet.';
 c.innerHTML=`<div style="display:flex;gap:16px;padding:18px">${p.profile_path?`<img src="${RH.img(p.profile_path,'w342')}" style="width:120px;height:170px;object-fit:cover;border-radius:16px" alt="">`:'<div class="ph" style="width:120px;height:170px;border-radius:16px;background:var(--f)"></div>'}<div><h1 style="font-size:24px">${esc(p.name)}</h1><p style="color:var(--mut);font-size:13px;line-height:1.7;margin:6px 0 10px">${esc(p.known_for_department||'')}${p.birthday?'<br>Born '+p.birthday+(age!=null?' ('+(p.deathday?'died at ':'age ')+age+')':''):''}${p.place_of_birth?'<br>'+esc(p.place_of_birth):''}</p><button class="btn ${fl[id]?'':'p'}" id="fo" style="height:38px">${fl[id]?'Following':'Follow'}</button></div></div><h2 style="margin-top:4px">Biography</h2><p id="bio" style="padding:0 18px;line-height:1.65;font-size:14.5px;color:var(--mut)">${esc(bio.length>380?bio.slice(0,380)+'...':bio)}</p>${bio.length>380?'<button class="chip" id="mr" style="margin:10px 18px 0">Read more</button>':''}${RH.row('Known for',known)}<h2>Filmography</h2><div class="list">${films.map(m=>`<a href="player.html?id=${m.id}">${esc(m.title)}<span>${m.release_date.slice(0,4)}${m.character?' - '+esc(m.character.slice(0,22)):''}</span></a>`).join('')||'<div class="state">No films listed.</div>'}</div>`;
 if($('#mr'))$('#mr').onclick=e=>{$('#bio').textContent=bio;e.target.remove()};
 $('#fo').onclick=e=>{const f=RH.get('rh_follow',{});if(f[id]){delete f[id];e.target.textContent='Follow';e.target.classList.add('p')}else{f[id]={id:+id,name:p.name};e.target.textContent='Following';e.target.classList.remove('p');RH.toast('Following '+p.name)}RH.set('rh_follow',f)};
}catch(e){c.innerHTML=RH.err(e.message)}})();
</script></body></html>
