<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Reelhouse</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body><div id="c"></div><script src="shared.js"></script><script>

RH.guard();RH.hdr('Settings');const s=RH.S(),c=$('#c');
const tg=(k,t,d)=>`<label class="rw"><span>${t}<small>${d}</small></span><input type="checkbox" class="sw" data-k="${k}" ${s[k]?'checked':''}></label>`;
const sl=(k,t,o)=>`<div class="rw"><span>${t}</span><select class="sel" data-k="${k}">${o.map(x=>`<option value="${x[0]}" ${s[k]==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>`;
c.innerHTML='<h2>Appearance</h2>'+sl('theme','Theme',[['system','System'],['light','Light'],['dark','Dark'],['amoled','AMOLED black']])+sl('accent','Accent color',[['#ff6a1a','Orange'],['#e5383b','Red'],['#2f7bff','Blue'],['#1fae6b','Green'],['#8b5cf6','Purple'],['#ec4899','Pink']])+sl('tsize','Text size',[['90','Small'],['100','Default'],['112','Large'],['125','Extra large']])+tg('rmotion','Reduce motion','Turn off animations and transitions')+
'<h2>Playback</h2>'+tg('autoplay','Autoplay trailers','Start trailers as soon as a title opens')+tg('preview','Hover / hold previews','Hold or hover a poster for a 10-second preview')+tg('psound','Preview sound','Play sound during previews (off = muted)')+sl('speed','Default playback speed',[['.75','0.75x'],['1','1x'],['1.25','1.25x'],['1.5','1.5x'],['2','2x']])+sl('skip','Skip button interval',[['5','5 seconds'],['10','10 seconds'],['15','15 seconds'],['30','30 seconds']])+tg('autonext','Auto-play next episode','Continue to the next episode when one ends')+tg('spoil','Spoiler shield','Blur descriptions of episodes you have not reached')+tg('saver','Data saver','Load smaller posters to save mobile data')+
'<h2>Feel</h2>'+tg('haptics','Vibrations','Haptic feedback on taps, sends and alerts')+tg('shake','Shake to surprise','Shake your phone to get a random great movie')+tg('cine','Coming-soon spotlight','Cinematic trailer pop-up for a movie you will love')+'<h2>Notifications</h2>'+tg('motd','Movie of the day','A daily pick, once a day')+sl('qs','Quiet hours start',[['off','Off'],['20','8 PM'],['21','9 PM'],['22','10 PM'],['23','11 PM'],['0','Midnight']])+sl('qe','Quiet hours end',[['off','Off'],['5','5 AM'],['6','6 AM'],['7','7 AM'],['8','8 AM'],['9','9 AM']])+tg('alerts','In-app alerts','Pop-up banners for releases and reminders')+tg('push','Phone notifications','Ask your browser to alert you outside the app')+'<a class="rw" href="notifs.html">Open notifications<small></small></a>'+
'<h2>Content</h2>'+tg('kids','Kids mode','Hides horror, thriller, crime and war titles; blocks 18+')+tg('adult','Include adult titles','Show 18+ titles in search and browse')+sl('lang','Language',[['en-US','English'],['fr-FR','Francais'],['es-ES','Espanol'],['pt-BR','Portugues'],['de-DE','Deutsch']])+sl('svc','My main streaming service',[['','None'],['8','Netflix'],['9','Prime Video'],['337','Disney+'],['1899','Max'],['350','Apple TV+'],['15','Hulu']])+sl('region','Release region',[['US','United States'],['NG','Nigeria'],['GB','United Kingdom'],['CA','Canada'],['IN','India'],['ZA','South Africa']])+
'<h2>Your data</h2><a class="rw" href="#" id="sv">Retake taste survey<small></small></a><a class="rw" href="setup.html">TMDB API key<small></small></a><a class="rw" href="stats.html">My stats and taste DNA<small></small></a><a class="rw" href="#" id="rt">Replay the app tour<small></small></a><a class="rw" href="#" id="im">Import my data<small></small></a><a class="rw" href="#" id="ex">Export my lists<small></small></a><a class="rw" href="#" id="cl" style="color:#d4281c">Clear all app data<small></small></a>'+
'<h2>About</h2><div class="rw"><span>Reelhouse<small>Version 5.0</small></span></div>';
c.onchange=e=>{const k=e.target.dataset.k;if(!k)return;const n=RH.S();n[k]=e.target.type=='checkbox'?e.target.checked:e.target.value;RH.set('rh_set',n);
 if(k=='theme')n.theme=='system'?delete document.documentElement.dataset.theme:document.documentElement.dataset.theme=n.theme;
 if(k=='push'&&n.push&&window.Notification)Notification.requestPermission().then(p=>{if(p!='granted'){n.push=false;RH.set('rh_set',n);e.target.checked=false;RH.toast('Permission was not granted')}});RH.skin();RH.toast('Saved')};
$('#sv').onclick=e=>{e.preventDefault();RH.set('rh_svy',0);location.href='home.html'};
$('#rt').onclick=e=>{e.preventDefault();RH.set('rh_tour',{});location.href='home.html'};
$('#im').onclick=e=>{e.preventDefault();const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text()),M={list:'rh_list',watched:'rh_seen',ratings:'rh_rate',reminders:'rh_rem',downloads:'rh_dl',friends:'rh_friends'};Object.entries(M).forEach(([a,k])=>d[a]!=null&&RH.set(k,d[a]));RH.toast('Data imported')}catch{RH.toast('That file could not be read')}};i.click()};
$('#ex').onclick=e=>{e.preventDefault();const d={list:RH.get('rh_list',[]),watched:RH.get('rh_seen',[]),ratings:RH.get('rh_rate',{}),reminders:RH.rem(),downloads:RH.dl(),friends:RH.friends()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));a.download='reelhouse-data.json';a.click()};
$('#cl').onclick=e=>{e.preventDefault();if(!confirm('Clear your lists, history, ratings and reminders?'))return;['rh_list','rh_hist','rh_seen','rh_rate','rh_rem','rh_rdone','rh_notifs','rh_search','rh_follow','rh_pref','rh_svy','rh_friends','rh_dl','rh_prog','rh_sent','rh_cine','rh_prof_'+RH.me()].forEach(k=>localStorage.removeItem(k));RH.toast('Cleared')};
</script></body></html>
