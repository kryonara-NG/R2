<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Reelhouse</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body style="padding-bottom:90px"><div id="it"></div><div class="tabs" id="tb2" style="padding:10px 18px 4px"></div><div style="padding:6px 18px 0"><input class="in" id="q" placeholder="Search followers and following"></div><div class="pplist" id="L" style="padding-top:12px"></div><div class="sbar"><input class="in" id="sm" placeholder="Add a message (optional)"><button class="btn p" id="go" disabled style="flex:none">Send</button></div><script src="shared.js"></script><script>
RH.guard();RH.hdr('Share');let m;try{m=JSON.parse(sessionStorage.rh_sharing)}catch{}if(!m)location.replace('home.html');
const fw=Object.values(RH.friends()),fo=RH.followers(),mp=new Map();[...fw,...fo].forEach(p=>mp.set(p.id,p));const all=[...mp.values()],fwi=new Set(fw.map(p=>p.id)),foi=new Set(fo.map(p=>p.id)),sel=new Set(),L=$('#L');let tab='all';
$('#it').innerHTML=`<div class="shi">${m.poster_path?'<img src="'+RH.img(m.poster_path)+'" alt="">':'<div class="ph"></div>'}<div><b>${esc(m.title)}</b><span>${m.mt=='tv'?'Series':'Movie'} - choose who gets it</span></div></div>`;
const T=()=>[['all','All',all.length],['fw','Following',fw.length],['fo','Followers',fo.length]];
function list(){const q=$('#q').value.toLowerCase();return all.filter(p=>(tab=='all'||(tab=='fw'?fwi:foi).has(p.id))&&p.name.toLowerCase().includes(q))}
function draw(){const a=list();$('#tb2').innerHTML=T().map(t=>`<button data-t="${t[0]}" class="${t[0]==tab?'on':''}" style="font-size:12.5px">${t[1]} ${t[2]}</button>`).join('');
 L.innerHTML=all.length?`<button class="lk" id="sa" style="padding:0 0 8px">${a.length&&a.every(p=>sel.has(p.id))?'Clear selection':'Select all ('+a.length+')'}</button>`+a.map(p=>`<button class="fr${sel.has(p.id)?' on':''}" data-id="${p.id}"><i>${p.av||'👤'}</i><span>${esc(p.name)}<small>${fwi.has(p.id)&&foi.has(p.id)?'Friends':foi.has(p.id)?'Follows you':'Following'}</small></span><em>${sel.has(p.id)?'✓':''}</em></button>`).join('')+'<button class="lk" id="mo">More share options (link, apps)</button>':'<div class="state"><b>No followers or following yet</b>Follow people and they will show up here.<br><br><a class="btn p" href="people.html?l=find">Find people</a><br><button class="lk" id="mo">Share a link instead</button></div>';
 $('#go').disabled=!sel.size;$('#go').textContent='Send'+(sel.size?' to '+sel.size:'')}
$('#tb2').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;draw()}};$('#q').oninput=draw;
L.onclick=async e=>{const r=e.target.closest('.fr');if(r){sel.has(r.dataset.id)?sel.delete(r.dataset.id):sel.add(r.dataset.id);RH.vib(8);draw()}
 else if(e.target.id=='sa'){const a=list();a.every(p=>sel.has(p.id))?a.forEach(p=>sel.delete(p.id)):a.forEach(p=>sel.add(p.id));draw()}
 else if(e.target.id=='mo'){const u=location.origin+location.pathname.replace(/[^/]*$/,'')+(m.mt=='tv'?'series':'player')+'.html?id='+m.id;try{navigator.share?await navigator.share({title:m.title,text:'Watch '+m.title+' on Reelhouse',url:u}):(await navigator.clipboard.writeText(u),RH.toast('Link copied'))}catch{}}};
$('#go').onclick=()=>{const box=RH.get('rh_inbox',{}),from=(RH.user()||{}).name||'A friend',msg=$('#sm').value.trim();let n=0;
 sel.forEach(id=>{const p=mp.get(id);if(p&&p.email)(box[p.email]=box[p.email]||[]).push({from,m,msg,ts:Date.now()});n++});
 RH.set('rh_inbox',box);RH.set('rh_sent',RH.get('rh_sent',0)+n);RH.vib([15,40,15,40,30]);RH.toast('Shared with '+n+(n>1?' people':' person'));setTimeout(()=>RH.back(),700)};draw();
</script></body></html>
