<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Reelhouse</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body><div class="pad"><h1>Library</h1></div><div class="tabs" style="overflow-x:auto;gap:6px"><button class="on" data-k="rh_list">My list</button><button data-k="rh_seen">Watched</button><button data-k="rem">Alerts</button><button data-k="rh_dl" id="dlTab" style="display:none">Downloads</button></div><div id="c"></div><script src="shared.js"></script><script>
RH.guard();const APP=RH.isNativeApp();const T=new URLSearchParams(location.search).get('t');let k=APP&&['rem','rh_dl','rh_seen'].includes(T)?T:['rem','rh_seen'].includes(T)?T:'rh_list';$('#dlTab').style.display=APP?'':'none';
const E={rh_list:['Your list is empty','Add movies from their page to find them here.'],rh_dl:['No downloads yet','Tap Download on a movie page. Every new download shows up here first.'],rh_seen:['Nothing watched yet','Tap "Mark watched" on a movie page.'],rem:['No alerts','Tap the bell on a coming-soon movie to get alerted on release day.']};
const hm=m=>m>=60?Math.floor(m/60)+'h '+m%60+'m':m+' min';
function items(){if(k=='rem')return Object.values(RH.rem()).sort((x,y)=>x.release_date.localeCompare(y.release_date));if(k=='rh_dl')return Object.values(RH.dl()).sort((a,b)=>b.ts-a.ts);return RH.get(k,[])}
function row(m){const p=RH.pct(m.id),rt=m.runtime||0,dl=RH.dl()[m.id],
 meta=k=='rem'?'Releases '+m.release_date:[rt?hm(rt):'',dl?'Downloaded - '+dl.mb+' MB':''].filter(Boolean).join(' | ')||'&nbsp;',
 prog=k=='rem'?'':`<div class="pb"><i style="width:${p}%"></i></div><small><b>${p}%</b> watched${rt?' - '+hm(Math.round(rt*p/100))+' of '+hm(rt):''}</small>`;
 return`<div class="lr" data-id="${m.id}"><a href="${RH.href(m)}">${m.poster_path?`<img loading="lazy" src="${RH.img(m.poster_path)}" alt="">`:'<div class="ph"></div>'}</a><div class="li"><b>${esc(m.title)}</b><span>${meta}</span>${prog}</div><button class="ib kb" aria-label="More options"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button></div>`}
function draw(){$$('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.k==k));const a=items(),dl=k=='rh_dl'?'<div style="padding:0 18px 10px;color:var(--mut);font-size:13px">'+a.length+' download'+(a.length==1?'':'s')+' - '+a.reduce((s,m)=>s+m.mb,0)+' MB</div>':'';
 $('#c').innerHTML=a.length?dl+a.map(row).join(''):'<div class="state"><b>'+E[k][0]+'</b>'+E[k][1]+'<br><br><a class="btn p" href="home.html">Browse movies</a></div>'}
function sheet(m){const inL=RH.get('rh_list',[]).some(x=>x.id==m.id),seen=RH.get('rh_seen',[]).some(x=>x.id==m.id),dl=!!RH.dl()[m.id],el=document.createElement('div');el.className='mod';document.body.append(el);RH.vib(10);
 const A=[['open','Open'],['share','Share with friends'],...(k=='rem'?[]:[['prog','Set watch progress'],['seen',seen?'Mark as unwatched':'Mark as watched']]),...(APP&&k!='rem'?[[ 'dl',dl?'Remove download':'Download']]:[]),...(k!='rh_list'&&k!='rem'?[['list',inL?'Remove from my list':'Add to my list']]:[]),['del',k=='rh_list'?'Remove from my list':k=='rh_dl'?'Delete download':k=='rh_seen'?'Remove from watched':'Remove alert',1]];
 el.innerHTML='<div class="sh2"><h1 style="font-size:18px">'+esc(m.title)+'</h1>'+A.map(a=>`<button class="ma${a[2]?' d':''}" data-a="${a[0]}">${a[1]}</button>`).join('')+'<button class="lk" data-a="x">Close</button></div>';
 el.onclick=async e=>{const t=e.target,a=t.dataset.a;if(t===el||a=='x')return el.remove();if(!a)return;
  if(a=='open')return location.href=RH.href(m);if(a=='share'){el.remove();return RH.shareSheet(m)}
  if(a=='prog'){el.querySelector('.sh2').innerHTML='<h1 style="font-size:18px">How much have you watched?</h1><div class="ops">'+[0,25,50,75,100].map(n=>`<button class="op${RH.pct(m.id)==n?' on':''}" data-p="${n}">${n}%</button>`).join('')+'</div><button class="lk" data-a="x">Cancel</button>';return}
  if(t.dataset.p!=null){const n=+t.dataset.p,s=RH.get('rh_seen',[]);RH.setProg(m,n);if(n<100)RH.set('rh_seen',s.filter(x=>x.id!=m.id));RH.vib([10,30,10]);el.remove();draw();return}
  if(a=='seen'){const s=RH.get('rh_seen',[]);if(seen){RH.set('rh_seen',s.filter(x=>x.id!=m.id));RH.setProg(m,0)}else{RH.setProg(m,100);RH.push('rh_seen',m,500)}RH.vib([10,30,10]);RH.toast(seen?'Marked unwatched':'Marked watched')}
  if(a=='list'){const l=RH.get('rh_list',[]);inL?RH.set('rh_list',l.filter(x=>x.id!=m.id)):RH.push('rh_list',m,200);RH.toast(inL?'Removed from list':'Added to list')}
  if(a=='dl'){if(dl){const d=RH.dl();delete d[m.id];RH.set('rh_dl',d);RH.toast('Download removed')}else{el.remove();await RH.download(m);draw();return}}
  if(a=='del'){RH.vib(30);if(k=='rem'){const r=RH.rem();delete r[m.id];RH.set('rh_rem',r)}else if(k=='rh_dl'){const d=RH.dl();delete d[m.id];RH.set('rh_dl',d)}else RH.set(k,RH.get(k,[]).filter(x=>x.id!=m.id));RH.toast('Removed')}
  el.remove();draw()}}
$('#c').onclick=e=>{const b=e.target.closest('.kb');if(!b)return;const id=b.closest('.lr').dataset.id,m=items().find(x=>x.id==id);m&&sheet(m)};
$('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;k=b.dataset.k;draw()};draw();RH.nav(2);
</script></body></html>
