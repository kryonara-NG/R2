<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Reelhouse</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body><div class="pad" style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:6px"><h1>Profile</h1><div><a class="ib" href="notifs.html" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 8H4c0-1 2-2 2-8z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="bd"></span></a></div></div>
<div class="pf"><div class="av" id="av"></div><div style="min-width:0"><h1 id="n"></h1><p id="e"></p><p id="bio"></p></div></div>
<div style="display:flex;gap:8px;padding:12px 18px 0"><button class="btn p" id="ed" style="flex:1;height:40px">Edit profile</button><button class="btn" id="fp" style="flex:1;height:40px">Find people</button></div>
<div class="cnt" id="cn"></div><h2>Level</h2><div class="xp" id="xp"></div><h2>Badges</h2><div class="bg2" id="bg"></div><div class="grid2" id="st" style="margin-top:22px"></div><h2>Your taste</h2><div class="chips" id="tp"></div><h2>Activity</h2><div class="list"><a href="library.html">My list, downloads and alerts</a><a href="notifs.html">Notifications</a><a href="#" id="cs">Clear search history</a><a href="#" id="ch">Clear watch history</a></div><h2>More</h2><div class="list"><a href="settings.html">Settings<span>Theme, alerts, haptics</span></a><a href="#" id="so" style="color:#d4281c">Sign out</a></div><script src="shared.js"></script><script>
RH.guard();const u=RH.user();RH.visit();
function c(){const pr=RH.prof(),sn=RH.get('rh_seen',[]),mins=sn.reduce((a,m)=>a+(m.runtime||0),0),gc={},fr=Object.values(RH.friends()),ar=Object.values(RH.get('rh_follow',{})),fo=RH.followers();sn.forEach(m=>(m.genres||[]).forEach(g=>gc[g]=(gc[g]||0)+1));
 const top=Object.entries(gc).sort((a,b)=>b[1]-a[1])[0],tg=top&&(RH.G.find(g=>g[0]==top[0])||[])[1];
 $('#av').innerHTML=pr.av+RH.tag(RH.days());$('#n').textContent=u.name||'Guest';$('#e').textContent=u.email;$('#bio').textContent=pr.bio||'Add a bio so friends know your taste.';
 $('#cn').innerHTML=[['Followers',fo.length,'fo'],['Following',fr.length,'fw'],['Artists',ar.length,'ar']].map(x=>`<button data-l="${x[2]}"><b>${x[1]}</b><span>${x[0]}</span></button>`).join('');
 const sent=RH.get('rh_sent',0),dl=Object.keys(RH.dl()).length,xp=sn.length*40+RH.get('rh_list',[]).length*5+fr.length*15+ar.length*10+sent*10+dl*5+Object.keys(RH.get('rh_rate',{})).length*8,lv=Math.floor(xp/100)+1,nm=['Newcomer','Regular','Cinephile','Critic','Legend'][Math.min(4,Math.floor((lv-1)/3))];
 $('#xp').innerHTML=`<b style="font:800 17px var(--disp)">Level ${lv} - ${nm}</b><div class="pb"><i style="width:${xp%100}%"></i></div><small style="color:var(--mut)">${xp%100}/100 XP to level ${lv+1}</small>`;
 const D=RH.days(),B=[['🎞️','First watch',sn.length>=1],['🍿','Binger',sn.length>=5],['🎬','Marathon',sn.length>=15],['🤝','Social',fr.length>=3],['⭐','Fan',ar.length>=3],['📤','Sharer',sent>=3],['⬇️','Offline',dl>=3],['🌟','Critic',Object.keys(RH.get('rh_rate',{})).length>=5],['📚','Collector',RH.get('rh_list',[]).length>=10],['🔥','3-day streak',RH.streak()>=3],['⚡','7-day streak',RH.streak()>=7],['🌱','Joined',true],['🥚','Curious',!!RH.get('rh_egg',0)],['🎲','Adventurer',RH.get('rh_search',[]).length>=5],['🥈','1 month',D>=30],['🥇','2 months',D>=60],['💎','6 months',D>=180],['👑','1 year',D>=365]],old=RH.get('rh_bgs',[]),now=B.filter(b=>b[2]).map(b=>b[1]),fresh=now.filter(x=>!old.includes(x));
 if(old.length&&fresh.length){RH.set('rh_bgs',now);RH.confetti();RH.vib([20,50,20,50,80]);RH.notify('New badge unlocked!',fresh.join(', '),'me.html')}else if(!old.length)RH.set('rh_bgs',now);
 $('#bg').insertAdjacentHTML('beforebegin','<a class="btn" href="stats.html" style="width:calc(100% - 36px);margin:0 18px 10px">View my stats and taste DNA</a>');$('#bg').innerHTML=B.map(b=>`<div class="bgd${b[2]?(fresh.includes(b[1])?' new':''):' off'}"><i>${b[0]}</i>${b[1]}</div>`).join('');
 $('#st').innerHTML=[[RH.get('rh_list',[]).length,'In my list'],[sn.length,'Watched'],[Math.round(mins/60)+' h','Hours watched'],[dl,'Downloads'],[sent,'Movies shared'],[tg||'-','Top genre']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
 const P=RH.get('rh_pref',{}),ch=[...(P.genres||[]).map(g=>(RH.G.find(x=>x[0]==g)||[])[1]),...(P.origin||[]),P.mood,P.who].filter(Boolean);$('#tp').innerHTML=ch.length?ch.map(x=>'<span class="chip">'+esc(x)+'</span>').join(''):'<span style="color:var(--mut);font-size:13.5px">Take the quick survey in Settings to personalise your feed.</span>'}c();
function mod(h){const el=document.createElement('div');el.className='mod';el.innerHTML='<div class="sh2">'+h+'<button class="lk" data-x>Close</button></div>';document.body.append(el);el.addEventListener('click',e=>{if(e.target===el||e.target.dataset.x!=null){el.remove();c()}});return el}
function people(list,title,empty){const f=RH.friends();const el=mod(`<h1>${title}</h1><div class="fl" style="max-height:60vh">${list.length?list.map(p=>{const m=RH.match(p),on=!!f[p.id];return`<div class="fr" style="cursor:default"><i>${p.av||'👤'}</i><span>${esc(p.name)}<small>${m?m+'% taste match':p.email||'Reelhouse member'}</small></span><button class="btn${on?'':' p'}" data-p="${p.id}" style="height:34px;padding:0 14px;font-size:13px">${on?'Following':'Follow'}</button></div>`}).join(''):'<div class="state">'+empty+'</div>'}</div>`);
 el.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=RH.people().find(x=>x.id==b.dataset.p),on=RH.follow(p);b.textContent=on?'Following':'Follow';b.classList.toggle('p',!on);if(on)RH.toast('Following '+p.name)})}
$('#cn').onclick=e=>{const b=e.target.closest('button');if(b)location.href='people.html?l='+b.dataset.l};
$('#fp').onclick=()=>location.href='people.html?l=find';
$('#ed').onclick=()=>{const pr=RH.prof();let av=pr.av;const el=mod(`<h1>Edit profile</h1><div class="ops" id="avs" style="margin-bottom:14px">${AVS.map(a=>`<button class="op${a==av?' on':''}" data-a="${a}" style="font-size:22px;padding:8px 12px">${a}</button>`).join('')}</div><input class="in" id="nm" value="${esc(u.name||'')}" placeholder="Name" maxlength="30" style="margin-bottom:10px"><input class="in" id="bi" value="${esc(pr.bio)}" placeholder="Short bio (e.g. Sci-fi addict)" maxlength="80"><button class="btn p" id="sv" style="width:100%;margin-top:14px">Save</button>`);
 el.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a){av=a.dataset.a;$$('#avs .op',el).forEach(x=>x.classList.toggle('on',x===a))}
  if(e.target.id=='sv'){const n=$('#nm',el).value.trim()||u.name;RH.setProf({av,bio:$('#bi',el).value.trim()});u.name=n;RH.set('rh_session',u);const us=RH.get('rh_users',{});if(us[u.email]){us[u.email].name=n;RH.set('rh_users',us)}$('#n').textContent=n;RH.vib([10,30,10]);RH.toast('Profile saved');el.remove();c()}})};
$('#cs').onclick=e=>{e.preventDefault();RH.set('rh_search',[]);RH.toast('Search history cleared')};
$('#ch').onclick=e=>{e.preventDefault();RH.set('rh_hist',[]);c();RH.toast('Watch history cleared')};
$('#so').onclick=e=>{e.preventDefault();localStorage.removeItem('rh_session');location.replace('index.html')};RH.nav(3);
</script></body></html>
