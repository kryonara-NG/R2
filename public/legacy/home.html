<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Reelhouse</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body><div id="app"></div><div id="host"></div><div id="sen" style="height:60px;text-align:center;color:var(--mut);font-size:13px;padding-top:20px">Loading more...</div><script src="shared.js"></script><script>

RH.guard();const app=$('#app'),host=$('#host'),P=RH.get('rh_pref',{}),today=new Date().toISOString().slice(0,10),M={},G=RH.G;
const OL={Korea:'ko',Bollywood:'hi',Anime:'ja',Nollywood:'yo|ig|ha'},pl=(P.origin||[]).map(o=>OL[o]).filter(Boolean).join('|');
app.innerHTML='<div class="hero sk" style="border-radius:0"></div>';
document.body.insertAdjacentHTML('afterbegin','<div class="tb" id="tb"><b id="lg">Reelhouse</b><a class="ib" id="dc" aria-label="Surprise me" style="font-size:18px">🎲</a><a class="ib" href="notifs.html" aria-label="Notifications">'+svg('bell')+'<span class="bd"></span></a></div>');
$('#dc').onclick=()=>RH.surprise();let eg=0;$('#lg').onclick=()=>{if(++eg>=7){eg=0;if(!RH.get('rh_egg',0)){RH.set('rh_egg',1);RH.notify('Secret badge unlocked','You found the Curious badge on your profile.','me.html')}RH.confetti();RH.toast('You found a secret!')}};
addEventListener('scroll',()=>$('#tb').classList.toggle('s',scrollY>240),{passive:true});
const dc=P.era=='Classics'?'&primary_release_date.lte=2000-12-31':P.era=='2010s'?'&primary_release_date.gte=2010-01-01&primary_release_date.lte=2019-12-31':'';
function sec(i){const c=Math.floor(Math.max(i-8,0)/G.length)+1;
 if(i==0){const rq=RH.recommendationQuery();return rq?{t:'Picked for you',p:'/discover/movie',q:'&sort_by=popularity.desc'+rq+dc}:{t:'Trending this week',p:'/trending/movie/week',q:''}}
 if(i==1)return{t:'Top 10 today',p:'/trending/movie/day',q:'',rank:1};
 if(i==2)return{soon:1,t:'Coming soon',p:'/movie/upcoming',q:'&page=1'};
 if(i==3)return pl?{t:'From your favourite regions',p:'/discover/movie',q:'&sort_by=popularity.desc&with_original_language='+pl}:{t:'Popular',p:'/movie/popular',q:''};
 if(i==4)return{t:'In cinemas now',p:'/movie/now_playing',q:''};
 if(i==5)return{t:'Top rated',p:'/movie/top_rated',q:''};
 if(i==6)return{t:'Trending series',p:'/trending/tv/week',q:''};
 if(i==7)return{t:'Top 10 series',p:'/trending/tv/day',q:'',rank:1};
 if(i==10)return{t:'Binge-worthy series',p:'/discover/tv',q:'&sort_by=popularity.desc&with_genres=18'};
 if(i%4==3)return{soon:1,t:'Coming soon',p:'/movie/upcoming',q:'&page='+(Math.floor(i/4)+1)};
 const g=G[(i-8)%G.length];return{t:g[1]+' picks',p:'/discover/movie',q:'&sort_by=popularity.desc&with_genres='+g[0]+'&page='+c}}
const ds=d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
function soon(a){a=a.filter(m=>m.release_date>=today&&(m.backdrop_path||m.poster_path));a.forEach(m=>M[m.id]=m);if(!a.length)return'';const r=RH.rem();
 return'<h2>Coming soon</h2><div class="row">'+a.map(m=>`<div class="sc"><a href="soon.html?id=${m.id}">${m.backdrop_path?`<img loading="lazy" src="${RH.img(m.backdrop_path,'w500')}" alt="">`:'<div class="ph"></div>'}</a><button class="bell${r[m.id]?' on':''}" data-id="${m.id}" aria-label="Remind me">${svg('bell')}</button><div class="sb"><b>${esc(m.title)}</b><span>Releases ${ds(m.release_date)}</span><div class="cd" data-d="${m.release_date}"></div></div></div>`).join('')+'</div>'}
function tick(){$$('.cd').forEach(e=>{let s=Math.floor((new Date(e.dataset.d+'T00:00:00')-Date.now())/1e3);if(s<=0){e.innerHTML='<p style="color:var(--o);font-weight:700;font-size:13px">Out now!</p>';return}
 const v=[['d',Math.floor(s/86400)],['h',Math.floor(s%86400/3600)],['m',Math.floor(s%3600/60)],['s',s%60]];e.innerHTML=v.map(x=>`<p><b>${String(x[1]).padStart(2,0)}</b>${x[0]}</p>`).join('')})}
setInterval(tick,1e3);
host.onclick=e=>{const b=e.target.closest('.bell');if(!b)return;const on=RH.toggleRem(M[b.dataset.id]);b.classList.toggle('on',on)};
let n=0,busy=0,hero;
async function more(){
 if(busy)return;
 busy=1;
 try{
  for(let j=0;j<2;j++){
   const s=sec(n++),d=await RH.api(s.p,s.q);
   const results=Array.isArray(d.results)?d.results:[];
   host.insertAdjacentHTML('beforeend',s.soon?soon(results):s.rank?`<h2>${s.t}</h2><div class="row">${results.slice(0,10).map((m,k)=>RH.rank(m,k+1)).join('')}</div>`:RH.row(s.t,results));
   tick();
  }
  $('#sen').textContent='Scroll for more';
 }catch(e){
  $('#sen').innerHTML='<button class="btn" id="retry-home" style="margin:auto">Retry</button>';
  $('#retry-home').onclick=()=>{ $('#sen').textContent='Loading more...'; more(); };
  RH.toast(e.message||'Could not load Reelhouse.');
 }finally{
  busy=0;
 }
 if($('#sen').getBoundingClientRect().top<innerHeight+500 && n<30)more();
}
(async()=>{try{const t=await RH.api('/trending/movie/week');hero=t.results;const h=hero[0],cont=RH.get('rh_hist',[]);
 app.innerHTML='<div class="hero" style="background-image:url('+RH.img(h.backdrop_path,'w780')+')"><div><h1>'+esc(h.title)+'</h1><p style="color:#eee;font-size:13px;margin:6px 0 12px">'+esc((h.overview||'').slice(0,110))+'...</p><a class="btn p" href="player.html?id='+h.id+'">Watch trailer</a> <button class="btn" id="sp" style="color:#fff;border-color:#fff8">Surprise me</button></div></div><div class="chips" style="margin-top:14px;overflow-x:auto;flex-wrap:nowrap">'+G.map(g=>'<a class="chip" style="flex:none" href="genre.html?g='+g[0]+'&n='+g[1]+'">'+g[1]+'</a>').join('')+'</div>'+RH.row('Continue watching',cont);
 $('#sp').onclick=()=>location.href='player.html?id='+hero[Math.floor(Math.random()*hero.length)].id;
 new IntersectionObserver(es=>es[0].isIntersecting&&more(),{rootMargin:'600px'}).observe($('#sen'));
}catch(e){app.innerHTML=RH.err(e.message)}RH.nav(0)})();
</script></body></html>
