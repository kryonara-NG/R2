<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Reelhouse</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body><div id="c" style="padding:6px 18px 40px"></div><script src="shared.js"></script><script>
RH.guard();RH.hdr('My stats');
const sn=RH.get('rh_seen',[]),mins=sn.reduce((a,m)=>a+(m.runtime||0),0),R=Object.values(RH.get('rh_rate',{})).map(x=>+x.r||+x).filter(Boolean),gc={};
sn.forEach(m=>(m.genres||[]).forEach(g=>gc[g]=(gc[g]||0)+1));
const top=Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=top[0]?top[0][1]:1,nm=id=>(RH.G.find(g=>g[0]==id)||[0,'Other'])[1],h=(mins/60).toFixed(1);
const card=(a,b,c)=>`<div style="flex:1;min-width:44%;background:var(--f);border-radius:20px;padding:16px"><b style="font:800 28px var(--disp);color:var(--o)">${a}</b><div style="font-size:12.5px;color:var(--mut);margin-top:2px">${b}</div></div>`;
$('#c').innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px">${card(h,'hours watched')}${card(sn.length,'titles finished')}${card(RH.streak(),'day streak')}${card(RH.days()+1,'days with Reelhouse')}${card(R.length?(R.reduce((a,b)=>a+b,0)/R.length).toFixed(1):'-','average rating you give')}${card(RH.get('rh_list',[]).length,'in your list')}</div>
<h2 style="margin:0 0 10px">Your taste DNA</h2>${top.length?top.map(t=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px"><span style="width:84px">${nm(t[0])}</span><div style="flex:1;height:12px;background:var(--f);border-radius:6px;overflow:hidden"><div style="height:100%;width:${t[1]/mx*100}%;background:var(--o);border-radius:6px"></div></div><b>${t[1]}</b></div>`).join('')+`<p style="color:var(--mut);font-size:13.5px;margin-top:14px;line-height:1.5">You are mostly a <b style="color:var(--ink)">${nm(top[0][0])}</b> person${top[1]?', with a soft spot for '+nm(top[1][0]):''}. ${mins>=600?'That is '+(mins/1440).toFixed(1)+' days of your life spent in great stories.':''}</p>`:'<div class="state"><b>Nothing here yet</b>Finish a few titles and your taste DNA will appear.</div>'}`;
</script></body></html>
