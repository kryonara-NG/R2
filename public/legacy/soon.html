<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Reelhouse</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body data-back="1" class="nn"><div style="position:sticky;top:0;z-index:5;background:#000"><header class="hd" style="background:#000;color:#fff;border:0"><button class="ib" onclick="RH.back()" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><b id="ht" style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw"></b><span style="flex:1"></span><button class="ib" id="sh" aria-label="Share"><svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 11 7.6-4M8.2 13l7.6 4"/></svg></button></header><div id="v" style="aspect-ratio:16/9;position:relative;background:#000"><div class="sk" style="position:absolute;inset:0;border-radius:0"></div></div></div><div id="b" style="padding:16px 0"></div><script src="shared.js"></script><script>
RH.guard();const id=new URLSearchParams(location.search).get('id'),v=$('#v'),b=$('#b'),today=new Date().toISOString().slice(0,10);
const DT=d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'long',day:'numeric',year:'numeric'});
function tick(d){const e=$('#cd');if(!e||!d)return;const s=Math.floor((new Date(d+'T00:00:00')-Date.now())/1e3);if(s<=0){location.replace('player.html?id='+id);return}
 e.innerHTML=[['days',Math.floor(s/86400)],['hrs',Math.floor(s%86400/3600)],['min',Math.floor(s%3600/60)],['sec',s%60]].map(x=>`<p><b>${String(x[1]).padStart(2,0)}</b>${x[0]}</p>`).join('')}
(async()=>{try{const d=await RH.api('/movie/'+id,'&append_to_response=videos,similar,credits,release_dates');
 if(d.release_date&&d.release_date<=today)return location.replace('player.html?id='+id);
 const vs=d.videos.results||[],tr=vs.find(x=>x.site==='YouTube'&&x.type==='Trailer')||vs.find(x=>x.site==='YouTube');
 $('#ht').textContent=d.title;document.title=d.title;
 if(tr)RH.Player(v,{yt:tr.key,auto:RH.S().autoplay});else v.innerHTML='<div style="position:absolute;inset:0;display:grid;place-items:center;color:#bbb;font-size:14px;text-align:center;padding:20px">No trailer yet - check back closer to release.</div>';
 const rg=((d.release_dates||{}).results||[]).find(x=>x.iso_3166_1==RH.S().region),T={1:'Premiere',2:'Limited release',3:'In cinemas',4:'Digital',5:'Physical',6:'TV'},rd=(rg?rg.release_dates:[]).filter(x=>T[x.type]).map(x=>[T[x.type],x.release_date.slice(0,10)]).sort((a,b)=>a[1]>b[1]?1:-1),
 on=()=>!!RH.rem()[d.id],dir=((d.credits.crew||[]).find(x=>x.job==='Director')||{}).name,
 days=d.release_date?Math.ceil((new Date(d.release_date+'T00:00:00')-Date.now())/864e5):null;
 b.innerHTML=`<div class="sdp"><span class="pill">COMING SOON</span><h1>${esc(d.title)}</h1>${d.tagline?'<p style="font-size:13px;opacity:.85;margin-bottom:12px">'+esc(d.tagline)+'</p>':'<div style="height:10px"></div>'}<small>${d.release_date?'RELEASES':'RELEASE DATE'}</small><div style="font:800 20px var(--disp);margin:2px 0 ${d.release_date?'10px':'0'}">${d.release_date?DT(d.release_date):'To be announced'}</div>${d.release_date?'<div class="cd" id="cd"></div><p style="font-size:12.5px;opacity:.8;margin-top:10px">'+(days==1?'Arrives tomorrow':days+' days to go')+'</p>':''}</div>
 <div style="padding:0 18px"><button class="btn p" id="rm" style="width:100%;height:54px;border-radius:27px;font-size:17px">${on()?'Reminder is on':'Remind me on release day'}</button>
 <div class="chips" style="padding:0;margin:16px 0 12px">${(d.genres||[]).map(g=>'<a class="chip" href="genre.html?g='+g.id+'&n='+g.name+'">'+esc(g.name)+'</a>').join('')}${d.runtime?'<span class="chip">'+d.runtime+' min</span>':''}${dir?'<span class="chip">Dir. '+esc(dir)+'</span>':''}${d.status&&d.status!='Released'?'<span class="chip">'+esc(d.status)+'</span>':''}</div>
 <h2 style="margin:16px 0 6px">About the film</h2><p style="line-height:1.6;font-size:14.5px;color:var(--mut)">${esc(d.overview||'The story is still under wraps.')}</p>
 ${rd.length?'<h2 style="margin:20px 0 4px">Release dates ('+esc(RH.S().region)+')</h2><div style="background:var(--f);border-radius:18px;padding:2px 16px">'+rd.map(x=>`<div class="rdl" style="border-color:var(--line)"><b>${x[0]}</b><span>${DT(x[1])}</span></div>`).join('')+'</div>':''}</div>
 <h2>Cast</h2><div class="row">${(d.credits.cast||[]).slice(0,16).map(c=>`<a class="pc" href="person.html?id=${c.id}">${c.profile_path?'<img loading="lazy" src="'+RH.img(c.profile_path,'w185')+'" alt="">':'<div class="ph"></div>'}<p>${esc(c.name)}<span>${esc(c.character||'')}</span></p></a>`).join('')}</div><div id="rel"></div>`;
 $('#sh').onclick=()=>RH.shareSheet(d);
 $('#rm').onclick=e=>{const x=RH.toggleRem(d);e.target.textContent=x?'Reminder is on':'Remind me on release day';RH.vib(x?[15,40,15]:8)};
 tick(d.release_date);if(d.release_date)setInterval(()=>tick(d.release_date),1e3);
 RH.api('/movie/upcoming','&page=1').then(u=>{const a=u.results.filter(m=>m.release_date>today&&m.id!=d.id&&m.poster_path),s=(d.similar.results||[]).filter(m=>m.id!=d.id);
  $('#rel').innerHTML=RH.row('Also coming soon',a)+RH.row('Related movies',s.slice(0,14))}).catch(()=>{$('#rel').innerHTML=RH.row('Related movies',(d.similar.results||[]).slice(0,14))})
}catch(e){b.innerHTML=RH.err(e.message)}})();
</script></body></html>
