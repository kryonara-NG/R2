<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b09"><title>Reelhouse</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body data-back="1" class="nn"><div style="position:sticky;top:0;z-index:5;background:#000"><header class="hd" style="background:#000;color:#fff;border:0"><button class="ib" onclick="RH.back()" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><b id="ht" style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw"></b><span style="flex:1"></span><button class="ib" id="sh" aria-label="Share"><svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 11 7.6-4M8.2 13l7.6 4"/></svg></button></header><div id="v" style="aspect-ratio:16/9;position:relative;background:#000"><div class="sk" style="position:absolute;inset:0;border-radius:0"></div></div></div><div id="b" style="padding:16px 0"></div><script src="shared.js"></script><script>
RH.guard();const id=new URLSearchParams(location.search).get('id'),v=$('#v'),b=$('#b');let D,S=1,EP=[],cur=null;
const TP=()=>RH.get('rh_tv',{})[id]||{w:{},last:null},savTP=t=>{const a=RH.get('rh_tv',{});a[id]=t;RH.set('rh_tv',a)},K=(s,e)=>s+'x'+e,OV=(s,e)=>RH.get('rh_videos',{})[id+':'+s+':'+e];
function state(h){v.innerHTML='<div style="position:absolute;inset:0;display:grid;place-items:center;color:#bbb;font-size:14px;text-align:center;padding:20px">'+h+'</div>'}
let P=null;function trailer(){if(P){P.destroy();P=null}v.innerHTML='';if(window.tk)P=RH.Player(v,{yt:window.tk,auto:1});else state('No trailer available.')}
function mark(s,e,on=true){const t=TP();on?t.w[K(s,e)]=1:delete t.w[K(s,e)];if(on)t.last={s,e};savTP(t);if(on&&!RH.get('rh_seen',[]).some(x=>x.id==D.id)&&nextUp()==null)RH.push('rh_seen',D,500)}
function nextUp(){const t=TP();for(const x of EP){if(!t.w[K(S,x.episode_number)]&&x.air_date&&x.air_date<=new Date().toISOString().slice(0,10))return x}return null}
function playEp(e){const x=EP.find(y=>y.episode_number==e);if(!x)return;cur=e;const o=OV(S,e);RH.vib(10);
 if(o){if(P)P.destroy();v.innerHTML='';P=RH.Player(v,{src:o,auto:1,onEnd:()=>{mark(S,e);const n=EP.find(y=>y.episode_number==e+1);list();if(n&&RH.S().autonext){RH.toast('Up next: E'+n.episode_number+' - '+n.name);setTimeout(()=>playEp(n.episode_number),2500)}}})}
 else{trailer();RH.toast('S'+S+' E'+e+' has no linked video - showing the trailer');}
 const t=TP();t.last={s:S,e};savTP(t);scrollTo({top:0,behavior:'smooth'});head()}
const ft=x=>!x.air_date||x.air_date>new Date().toISOString().slice(0,10);
function head(){const t=TP(),n=nextUp(),w=EP.filter(x=>t.w[K(S,x.episode_number)]).length,left=EP.filter(x=>!t.w[K(S,x.episode_number)]&&!ft(x)),mins=left.reduce((a,x)=>a+(x.runtime||D.episode_run_time?.[0]||45),0);
 $('#up').innerHTML=n?`<div class="upn"><div><b>${w?'Resume':'Start'} S${S} E${n.episode_number}</b>${esc(n.name)} - ${mins>=60?Math.floor(mins/60)+'h '+mins%60+'m':mins+'m'} left in season</div><button class="btn p" id="pu" style="height:40px">Play</button></div>`:'<div class="upn"><div><b>Season complete</b>You have seen every aired episode.</div></div>';
 if(n)$('#pu').onclick=()=>playEp(n.episode_number)}
function list(){const t=TP(),n=nextUp(),sp=$('#spo').checked;$('#eps').innerHTML=EP.length?EP.map(x=>{const e=x.episode_number,w=!!t.w[K(S,e)],hide=sp&&!w&&n&&e>n.episode_number;
 return`<div class="ep${ft(x)?' fut':''}" data-e="${e}"><div class="ept" data-p="${e}">${x.still_path?'<img loading="lazy" src="'+RH.img(x.still_path,'w300')+'" alt="">':''}<div class="pl">${ft(x)?'':'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}</div>${w?'<div class="pb"><i style="width:100%"></i></div>':''}</div><div class="epi"><b>${e}. ${esc(x.name)}</b><small>${ft(x)?'Airs '+(x.air_date?new Date(x.air_date+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):'TBA'):(x.runtime?x.runtime+' min':'')+(x.air_date?' - '+x.air_date:'')}</small><p class="${hide?'sp':''}">${esc(x.overview||'No description yet.')}</p></div><button class="ck${w?' on':''}" data-c="${e}" aria-label="Watched">${svg('check')}</button></div>`}).join(''):'<div class="state">No episodes listed yet.</div>';head()}
async function season(n){S=n;$('#eps').innerHTML='<div style="padding:0 18px">'+RH.sk(1).replace('card','').replace('aspect-ratio:2/3','height:90px')+'</div>';try{EP=(await RH.api('/tv/'+id+'/season/'+n)).episodes||[];list()}catch(e){$('#eps').innerHTML=RH.err(e.message)}}
(async()=>{try{D=await RH.api('/tv/'+id,'&append_to_response=videos,similar,credits,watch/providers');D.mt='tv';const vs=D.videos.results||[],tr=vs.find(x=>x.site==='YouTube'&&x.type==='Trailer')||vs.find(x=>x.site==='YouTube');window.tk=tr&&tr.key;
 $('#ht').textContent=D.name;document.title=D.name;RH.push('rh_hist',D);trailer();
 const ss=(D.seasons||[]).filter(x=>x.season_number>0),t=TP(),inList=()=>RH.get('rh_list',[]).some(x=>x.id===D.id),pr=((D['watch/providers']||{}).results||{})[RH.S().region]||{},pv=(pr.flatrate||[]).map(x=>x.provider_name).slice(0,5);
 b.innerHTML=`<div style="padding:0 18px"><h1 style="font-size:24px">${esc(D.name)}</h1>${D.tagline?'<p style="color:var(--o);font-size:13px;margin-top:4px">'+esc(D.tagline)+'</p>':''}<p style="color:var(--mut);font-size:13.5px;margin:6px 0 12px">${[(D.first_air_date||'').slice(0,4),D.number_of_seasons+' season'+(D.number_of_seasons>1?'s':''),D.number_of_episodes+' episodes',D.vote_average?D.vote_average.toFixed(1)+' rating':'',D.status].filter(Boolean).join('  |  ')}</p><div class="chips" style="padding:0;margin-bottom:14px">${(D.genres||[]).map(g=>'<span class="chip">'+esc(g.name)+'</span>').join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" id="pt">Trailer</button><button class="btn" id="ls">${inList()?'In my list':'Add to list'}</button></div>${pv.length?'<div class="chips" style="padding:0;margin-top:12px">'+pv.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>':''}<p style="line-height:1.6;font-size:14.5px;margin:14px 0;color:var(--mut)">${esc(D.overview||'')}</p></div><div id="up" style="margin-bottom:10px"></div><div style="display:flex;gap:8px;align-items:center;padding:6px 18px"><select class="sel" id="ss" style="flex:1;height:42px">${ss.map(x=>'<option value="'+x.season_number+'">'+esc(x.name)+' ('+x.episode_count+' eps)</option>').join('')}</select><label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)">Spoiler shield<input type="checkbox" class="sw" id="spo" ${RH.S().spoil?'checked':''}></label></div><div id="eps"></div><h2>Cast</h2><div class="row">${(D.credits.cast||[]).slice(0,16).map(c=>`<a class="pc" href="person.html?id=${c.id}">${c.profile_path?'<img loading="lazy" src="'+RH.img(c.profile_path,'w185')+'" alt="">':'<div class="ph"></div>'}<p>${esc(c.name)}<span>${esc(c.character||'')}</span></p></a>`).join('')}</div>${RH.row('More like this',(D.similar.results||[]).slice(0,12).map(x=>({...x,media_type:'tv'})))}`;
 $('#pt').onclick=trailer;$('#sh').onclick=()=>RH.shareSheet(D);
 $('#ls').onclick=()=>{const a=RH.get('rh_list',[]);if(inList()){RH.set('rh_list',a.filter(x=>x.id!==D.id));$('#ls').textContent='Add to list';RH.toast('Removed from list')}else{RH.push('rh_list',D,200);$('#ls').textContent='In my list';RH.toast('Added to list')}};
 $('#ss').onchange=e=>season(+e.target.value);$('#spo').onchange=list;
 $('#eps').onclick=e=>{const c=e.target.closest('[data-c]'),p=e.target.closest('[data-p]'),sp=e.target.closest('p.sp');
  if(c){const n=+c.dataset.c,on=!TP().w[K(S,n)];mark(S,n,on);RH.vib(8);list();if(on&&!nextUp()&&EP.length){RH.confetti();RH.toast('Season finished!')}}
  else if(p){const x=EP.find(y=>y.episode_number==p.dataset.p);if(!ft(x))playEp(x.episode_number)}else if(sp)sp.classList.remove('sp')};
 const first=t.last&&ss.some(x=>x.season_number==t.last.s)?t.last.s:(ss[0]||{season_number:1}).season_number;$('#ss').value=first;season(first)
}catch(e){state('');b.innerHTML=RH.err(e.message)}})();
</script></body></html>
